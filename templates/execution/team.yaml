# Edward 团队协议
# 项目初始化时由 Edward 起草，必须与 goal / plan / KPI / 工作方案一起交人类评审。
# 人类批准后才能 team sync 生成 subagent；一旦开工，每个工作项都必须通过 task 调用协议中的角色。
#
# 字段说明：
# - status: draft（待评审）或 approved（已批准）
# - approval.content_hash: approve 时自动写入；批准后设计若有变化，会要求重新评审
# - orchestration.strategy: sequential / parallel / mixed
# - roles[].id: 小写字母开头，总长 2-41，仅含小写字母、数字、连字符；生成的 subagent 名为 edward-<id>
# - `.opencode/agents/edward-*.md` 为 team sync 保留的生成目录，禁止手工放入其它同名文件
# - roles[].responsibilities / deliverables: 该角色的责任边界和交付物
# - roles[].can_delegate: 是否允许该 subagent 继续用 task 委派
# - workflow: 工序编排，roles 引用上面的角色 id

version: 1
status: draft
name: ""
objective: ""
approval:
  approved_by: null
  approved_at: null
  reference: null
  content_hash: null
orchestration:
  strategy: sequential
  rules: []
roles: []
workflow: []

